kind = "mobile"
previewPath = "/"
title = "Branchwing"
version = "1.0.0"
id = "artifacts/branchwing"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 25002

[services.development]
run = "pnpm --filter @workspace/branchwing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/branchwing", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/branchwing", "run", "serve" ]

[services.env]
PORT = "25002"
BASE_PATH = "/"
