openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: trips
    description: Trip persistence and sync
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /trips:
    get:
      operationId: listTrips
      tags: [trips]
      summary: List trips for the signed-in user
      description: Returns all trips that belong to the authenticated user.
      security:
        - clerkBearer: []
      responses:
        "200":
          description: List of trips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trip"
        "401":
          description: Missing or invalid auth token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: replaceTrips
      tags: [trips]
      summary: Replace all trips for the signed-in user
      description: >-
        Bulk-upserts the full list of trips for the authenticated user.
        Any trips previously stored for this user that are not in the body
        are deleted. This makes the endpoint idempotent and easy to call after
        every local change.
      security:
        - clerkBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trips]
              properties:
                trips:
                  type: array
                  items:
                    $ref: "#/components/schemas/Trip"
      responses:
        "200":
          description: Updated list of trips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trip"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid auth token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    clerkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk-issued session JWT obtained via getToken() in the mobile client.
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Segment:
      type: object
      required:
        - id
        - fromCode
        - fromCity
        - toCode
        - toCity
        - depart
        - arrive
        - airline
        - flightNo
      properties:
        id:
          type: string
        fromCode:
          type: string
        fromCity:
          type: string
        toCode:
          type: string
        toCity:
          type: string
        depart:
          type: string
        arrive:
          type: string
        airline:
          type: string
        flightNo:
          type: string
        price:
          type: ["number", "null"]
    Branch:
      type: object
      required:
        - id
        - label
        - parentId
        - forkAfterSegmentId
        - color
        - segments
        - createdAt
      properties:
        id:
          type: string
        label:
          type: string
        parentId:
          type: ["string", "null"]
        forkAfterSegmentId:
          type: ["string", "null"]
        color:
          type: string
        segments:
          type: array
          items:
            $ref: "#/components/schemas/Segment"
        createdAt:
          type: string
    Trip:
      type: object
      required:
        - id
        - title
        - originCity
        - originCode
        - startDate
        - branches
        - activeBranchId
        - createdAt
      properties:
        id:
          type: string
        title:
          type: string
        originCity:
          type: string
        originCode:
          type: string
        startDate:
          type: string
        branches:
          type: array
          items:
            $ref: "#/components/schemas/Branch"
        activeBranchId:
          type: string
        createdAt:
          type: string
